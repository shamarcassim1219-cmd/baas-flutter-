name: mybaas_baas
description: MYBAAS for Baas - manage job requests, wallet, and your profile.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Networking
  http: ^1.2.0

  # Secure token storage (encrypted, replaces localStorage)
  flutter_secure_storage: ^9.0.0

  # Stable per-device ID, for the admin device-ban feature
  device_info_plus: ^11.1.0

  # State management
  provider: ^6.1.2

  # Location (for updating a Baas's saved location, and computing
  # distance to incoming job requests)
  geolocator: ^12.0.0

  # Image picking (profile photo)
  image_picker: ^1.1.2

  # Date formatting (job dates, notification timestamps)
  intl: ^0.19.0

  # Icons matching the customer app's line-icon style
  cupertino_icons: ^1.0.6

  # Declarative, easy-to-chain animations (.fadeIn().slideY() etc)
  flutter_animate: ^4.5.0

  # Non-sensitive local settings
  shared_preferences: ^2.3.2

  # Pull-to-refresh with a nicer built-in animation than the
  # platform default.
  liquid_pull_to_refresh: ^3.0.1

  # Skeleton loading placeholders (shimmer effect) instead of bare
  # spinners.
  shimmer: ^3.0.0

  # PayHere's checkout is a web page - shown inside an in-app
  # webview instead of leaving the app (top-up, platform fee).
  webview_flutter: ^4.9.0

  # Reverse-geocodes lat/lng into a readable place name, to
  # auto-fill the Location Label after "Use My Current Location"
  # rather than leaving that field blank for the Baas to type by hand.
  # Pinned to 5.x (not 3.x) - the 3.x geocoding_android release is
  # itself compiled against an old Android SDK level that a Gradle
  # script can't override after the fact, unlike a plain compileSdk
  # mismatch on :app itself.
  geocoding: ^5.0.0

  # Native share sheet - used for sharing a referral code/message
  # via whatever apps the user has installed (WhatsApp, SMS, etc).
  share_plus: ^11.0.0

  # Real push notifications (Firebase Cloud Messaging) - works even
  # when the app is closed/backgrounded.
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
